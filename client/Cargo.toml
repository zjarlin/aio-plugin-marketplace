[package]
name = "aio-plugin-marketplace-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
az-dioxus-admin-shell = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "11c0d3856e541e3421854a2a96e995ba02546c3a" }
az-ui-components = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "11c0d3856e541e3421854a2a96e995ba02546c3a" }
dill = "0.15.0"
dioxus = { version = "=0.7.9", default-features = false, features = ["macro", "html", "signals"] }
gloo-net = { version = "0.6.0", features = ["http", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
web-sys = { version = "0.3.77", features = ["Location", "Window"] }

